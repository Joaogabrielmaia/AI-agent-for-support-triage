services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: prumo
      POSTGRES_PASSWORD: prumo
      POSTGRES_DB: prumo
    ports:
      - "5440:5432"
    volumes:
      - prumo-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prumo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  prumo-data:
